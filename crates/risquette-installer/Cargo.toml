[package]
name = "risquette-installer"
description = "Branded installer, updater and uninstaller for Risquette"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "risquette-setup"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
smol.workspace = true
log.workspace = true
env_logger.workspace = true
dirs = "7"
risquette-theme.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
