# Weekly pull requests for dependency updates. They go through CI and review
# like any other change.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates arrive as one pull request; majors stay separate.
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: these must match what GPUI uses (see crates/risquette/Cargo.toml).
      - dependency-name: gpui
      - dependency-name: wry
      - dependency-name: windows
      # libc 0.2.190 dropped ENOATTR on Linux, which xattr 0.2.3 (pulled in by
      # GPUI's HTTP client) needs, so the Linux build fails. Held at 0.2.189 in
      # Cargo.lock until GPUI moves to a newer xattr.
      - dependency-name: libc
        versions: [">= 0.2.190"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
