# Builds the Windows installer and the Linux AppImage and publishes them to a
# GitHub release when a version tag is pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
#
# Who can release: only the repository owner. A tag ruleset stops anyone else
# creating `v*` tags, every job refuses to run for anyone but the owner, and the
# `release` environment only accepts `v*` tags.
#
# The update server (Risquette-Backend) reads these release files:
#   RisquetteSetup-<version>-windows-x86_64.exe   (+ .sha256)  Windows installer
#   Risquette-<version>-linux-x86_64.AppImage     (+ .sha256)  Linux AppImage
# The app refuses updates without the checksum files. Tags with a pre-release
# suffix (v0.3.0-beta.1) become pre-releases, offered only on the beta channel.
#
# Release notes come from the tag's section in CHANGELOG.md
# (`python scripts/changelog.py prepare <version>` creates it). The app shows
# them in its update dialog, so the job stops early if they're missing.
#
# Every release first waits for CI to have passed on the tagged commit. A
# bug-fix release (a stable x.y.z with z > 0, e.g. v0.3.1) then skips running
# the tests again, since CI just ran them on that exact commit, which roughly
# halves the time. Feature releases and betas run them again as a last check.
# Release binaries are always built from scratch (no build cache).
#
# Settings (optional):
#   Variable RISQUETTE_UPDATE_URL  a different update server to bake into the app
#                                  (default: the official https://risquette.xnoid.studio)
#   Secrets in the `release` environment, for code signing (Windows):
#                                  SIGNTOOL_CERT_BASE64, SIGNTOOL_PASSWORD

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version and notes
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read # see CI's results for the tagged commit
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "risquette"))')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Cargo version ${version}"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/changelog.py check
          python3 scripts/changelog.py notes "${GITHUB_REF_NAME}" --out release-notes.md
          cat release-notes.md
      - name: Kind of release
        id: kind
        run: |
          kind="$(python3 scripts/changelog.py kind "${GITHUB_REF_NAME}")"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "This is a ${kind} release."
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # The checks "Protect main" requires. CI may still be running if the tag
        # was pushed right after merging, so wait for it (up to 45 minutes).
        run: |
          required=("Formatting" "Clippy" "Tests" "Docs and links" "Dependency audit" "Linux" "Linux AppImage")
          for attempt in $(seq 1 90); do
            runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              -q '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"
            pending=0
            for name in "${required[@]}"; do
              line="$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n' | head -n 1)"
              status="$(printf '%s' "$line" | cut -f2)"
              conclusion="$(printf '%s' "$line" | cut -f3)"
              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "::error::CI check \"${name}\" ${conclusion} on ${GITHUB_SHA}. Fix it on main and tag the fixed commit."
                exit 1
              elif [ "$status" != "completed" ]; then
                pending=1
              fi
            done
            if [ "$pending" = 0 ]; then
              echo "Every required CI check passed on ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for CI on ${GITHUB_SHA}…"
            sleep 30
          done
          echo "::error::CI didn't finish on ${GITHUB_SHA} within 45 minutes (or never ran: tag a commit on main)."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  windows:
    name: Build (Windows)
    needs: check
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    environment: release
    env:
      SIGNTOOL_CERT_BASE64: ${{ secrets.SIGNTOOL_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No build cache here on purpose: release binaries are always built from scratch.

      # CI already passed on this commit; bug-fix releases don't run the tests again.
      - name: Test
        if: needs.check.outputs.kind != 'bugfix'
        run: cargo test --workspace --locked

      - name: Prepare signing certificate
        if: env.SIGNTOOL_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNTOOL_CERT_BASE64))
          "SIGNTOOL_CERT=$path" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        env:
          RISQUETTE_UPDATE_URL: ${{ vars.RISQUETTE_UPDATE_URL }}
          SIGNTOOL_PASSWORD: ${{ secrets.SIGNTOOL_PASSWORD }}
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  linux:
    name: Build (Linux)
    needs: check
    if: github.actor == github.repository_owner
    # The oldest supported Ubuntu, so the AppImage runs on as many distributions as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          xargs -a packaging/linux/build-deps.txt sudo apt-get install -y --no-install-recommends

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Test
        if: needs.check.outputs.kind != 'bugfix'
        run: cargo test --workspace --exclude risquette-installer --locked

      - name: Package
        env:
          RISQUETTE_UPDATE_URL: ${{ vars.RISQUETTE_UPDATE_URL }}
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  publish:
    name: Publish release
    needs: [windows, linux]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Risquette ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Notes from CHANGELOG.md. GitHub's automatic notes stay off: their
          # @mentions would show as Discuit profile links in the app.
          body_path: artifacts/release-notes/release-notes.md
          files: |
            artifacts/windows/RisquetteSetup-*.exe
            artifacts/windows/RisquetteSetup-*.exe.sha256
            artifacts/linux/Risquette-*.AppImage
            artifacts/linux/Risquette-*.AppImage.sha256
