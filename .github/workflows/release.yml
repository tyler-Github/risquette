# Builds the Windows installer and publishes it to a GitHub release when a
# version tag is pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
#
# Who can release: only the repository owner. A tag ruleset stops anyone else
# creating `v*` tags, the job below refuses to run for anyone but the owner,
# and the `release` environment only accepts `v*` tags.
#
# The update server (Risquette-Backend) reads these releases:
#   RisquetteSetup-<version>-windows-x86_64.exe         the installer
#   RisquetteSetup-<version>-windows-x86_64.exe.sha256  its checksum (required by the app)
# Tags with a pre-release suffix (v0.3.0-beta.1) become pre-releases and are
# offered only on the beta channel.
#
# Release notes come from the tag's section in CHANGELOG.md
# (`python scripts/changelog.py prepare <version>` creates it). The app shows
# them in its update dialog, so the job stops early if they're missing.
#
# Settings (optional):
#   Variable RISQUETTE_UPDATE_URL  a different update server to bake into the app
#                                  (default: the official https://risquette.xnoid.studio)
#   Secrets in the `release` environment, for code signing:
#                                  SIGNTOOL_CERT_BASE64, SIGNTOOL_PASSWORD

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
    env:
      SIGNTOOL_CERT_BASE64: ${{ secrets.SIGNTOOL_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No build cache here on purpose: release binaries are always built from scratch.

      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "risquette").version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match Cargo version $version" }

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          python scripts/changelog.py check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/release" | Out-Null
          python scripts/changelog.py notes $env:GITHUB_REF_NAME --out "$env:RUNNER_TEMP/release/notes.md"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content "$env:RUNNER_TEMP/release/notes.md"

      - name: Test
        run: cargo test --workspace --locked

      - name: Prepare signing certificate
        if: env.SIGNTOOL_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNTOOL_CERT_BASE64))
          "SIGNTOOL_CERT=$path" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        env:
          RISQUETTE_UPDATE_URL: ${{ vars.RISQUETTE_UPDATE_URL }}
          SIGNTOOL_PASSWORD: ${{ secrets.SIGNTOOL_PASSWORD }}
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Risquette ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Notes from CHANGELOG.md. GitHub's automatic notes stay off: their
          # @mentions would show as Discuit profile links in the app.
          body_path: ${{ runner.temp }}/release/notes.md
          files: |
            dist/RisquetteSetup-*.exe
            dist/RisquetteSetup-*.exe.sha256
