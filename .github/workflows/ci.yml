# Checks every pull request and every push to main.
#
# Pull requests from first-time and outside contributors only run after a
# maintainer approves them in the Actions tab (repository setting), so code
# from forks can't use the runners until someone has looked at it.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          # Only main writes the cache, so a pull request can't poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Unit tests never contact a real Discuit instance; write endpoints are
      # checked against a local test server.
      - run: cargo test --workspace --locked
      - name: Build the app and installer
        run: cargo build --workspace --locked

  linux:
    name: Linux
    # The oldest supported Ubuntu, matching the AppImage release build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          xargs -a packaging/linux/build-deps.txt sudo apt-get install -y --no-install-recommends
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The installer is Windows-only, so it's left out here.
      - run: cargo clippy --workspace --exclude risquette-installer --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude risquette-installer --locked

  appimage:
    name: Linux AppImage
    # Packages the AppImage the way a release does, then opens it on a virtual
    # display, so packaging and start-up problems show up before a release.
    # The AppImage is kept for a week, for trying the change by hand.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          xargs -a packaging/linux/build-deps.txt sudo apt-get install -y --no-install-recommends
          # A virtual display and a software Vulkan driver, to open the app without a screen or GPU.
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/package-linux.sh
      - name: Open the app
        run: |
          app="$(ls dist/*.AppImage)"
          profile="$RUNNER_TEMP/profile"
          export RISQUETTE_CONFIG_DIR="$profile" RISQUETTE_WINDOWED=1 APPIMAGE_EXTRACT_AND_RUN=1
          # Still running after 30 seconds (timeout's exit code 124) means it started.
          set +e
          timeout 30 xvfb-run -a -s "-screen 0 1280x900x24" "$app"
          code=$?
          set -e
          echo "--- log"
          cat "$profile"/logs/*.log 2>/dev/null || echo "(no log)"
          if ls "$profile"/crashes/crash-* >/dev/null 2>&1; then
            echo "--- crash report"
            cat "$profile"/crashes/crash-*
            exit 1
          fi
          if [ "$code" -ne 124 ]; then
            echo "The app exited with code $code instead of staying open."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/*
          retention-days: 7

  docs:
    name: Docs and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
      - name: Changelog is valid
        run: python scripts/changelog.py check
      - name: Changelog script tests
        run: python scripts/test_changelog.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - run: cargo audit
